version: '3.9'

services:

  redis:
    image: redis:latest
    restart: on-failure
    expose:
      - '6379'

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - '5432'

  web:
    build: .
    command: bash -c 'python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  celery:
    build: .
    command: bash -c 'celery -A config worker -l info -P eventlet'
    depends_on:
      - redis
      - db
      - web
    restart: on-failure
    volumes:
      - .:/web
    env_file:
      - .env

  celery-beat:
    build: .
    command: bash -c 'celery -A config beat -l info'
    depends_on:
      - redis
      - db
      - web
    restart: on-failure
    volumes:
      - .:/web
    env_file:
      - .env


volumes:
  postgres_data:
  static_volume: